# Top-level project name -- used as a prefix on container, network, and
# volume names.  Renamed from the implicit `agentforge` (derived from
# the folder name) to `security-analyzer` so the local stack matches
# the project's user-facing identity.  The Railway deployment still
# uses the older `agentforge` naming and is unaffected.
name: security-analyzer

services:
  security-analyzer-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: security-analyzer-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AgentForge!2026"
      MSSQL_PID: "Developer"
    # Host port 14330 -> container 1433: the host's default SQL Server
    # (MSSQLSERVER service) often binds 1433 first, so we publish on a
    # less-contested port.  Connection strings from the host use
    # Server=localhost,14330; from sibling containers use
    # security-analyzer-db:1433.
    ports:
      - "14330:1433"
    volumes:
      - db-data:/var/opt/mssql

  security-analyzer-web:
    build:
      context: .
      dockerfile: AgentForge.Web/Dockerfile
    container_name: security-analyzer-web
    depends_on:
      - security-analyzer-db
    environment:
      AGENTFORGE_DB: "Server=security-analyzer-db,1433;Database=AgentForge;User Id=sa;Password=AgentForge!2026;TrustServerCertificate=true"
      COPILOT_BASE_URL: "https://openemr-web-production.up.railway.app"
      # Required to enable the "Start RedTeam run" button.  Inherited
      # from the host shell or a .env file next to this compose file.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    ports:
      - "5080:8080"

  # Runs the Harness on a timer (configured via dbo.Parameters key
  # 'executor-loop-minutes') and exposes POST /runs to trigger an
  # immediate run.  Web is listed in depends_on so the schema (which
  # creates dbo.Parameters and dbo.ExecutorRuns) is applied first;
  # the Executor additionally polls until dbo.Parameters is readable
  # before starting its loop.
  security-analyzer-executor:
    build:
      context: .
      dockerfile: AgentForge.Executor/Dockerfile
    container_name: security-analyzer-executor
    depends_on:
      - security-analyzer-db
      - security-analyzer-web
    environment:
      AGENTFORGE_DB: "Server=security-analyzer-db,1433;Database=AgentForge;User Id=sa;Password=AgentForge!2026;TrustServerCertificate=true"
      COPILOT_BASE_URL: "https://openemr-web-production.up.railway.app"
    ports:
      - "5081:8080"

volumes:
  # The physical volume is the one originally created under the old
  # `agentforge` project (Docker prefixes volume names with the project
  # name).  We bind to it via `external:` so the compose-project rename
  # does NOT trigger creation of a fresh, empty volume -- which would
  # silently wipe the AgentForge SQL Server data on first `up`.
  db-data:
    external: true
    name: agentforge_agentforge-db
